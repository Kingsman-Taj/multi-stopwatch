<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Multi Stopwatch</title>
<style>
html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: monospace;
}
canvas {
    display: block;
    image-rendering: pixelated;
}
#ui {
    position: absolute;
    top: 2vh;
    left: 0; right: 0;
    text-align: center;
    color: #0ff;
    font-size: 4.5vw;
    z-index: 10;
}
#log {
    position: absolute;
    bottom: 2vh;
    left: 2vw; right: 2vw;
    color: #ff0;
    font-size: 3vw;
    z-index: 10;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <strong>MULTI STOPWATCH</strong> | #<span id="selected">1</span>
</div>
<div id="log"></div>

<script>
// =============== FULLY RESPONSIVE ===============
const MAX_STOPWATCHES = 10;
let watches = Array(MAX_STOPWATCHES).fill().map(() => ({
  running: false,
  startTime: 0,
  accumulated: 0,
  laps: []
}));

let selected = 0;
let messages = [];
let showLapHistory = false;
let graphScroll = 0;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function sx(v) { return v * canvas.width / 240; }
function sy(v) { return v * canvas.height / 320; }
function font(size) { return `${Math.floor(sy(size))}px monospace`; }

// Load saved data
const saved = localStorage.getItem("multiStopwatch");
if (saved) {
  try {
    const data = JSON.parse(saved);
    watches = data.map(w => ({
      running: false,
      startTime: 0,
      accumulated: w.accumulated || 0,
      laps: w.laps || []
    }));
  } catch(e) {}
}

document.addEventListener('keydown', e => {
  e.preventDefault();

  if (e.key === '4' || e.key === 'ArrowLeft') selected = (selected - 1 + MAX_STOPWATCHES) % MAX_STOPWATCHES;
  if (e.key === '6' || e.key === 'ArrowRight') selected = (selected + 1) % MAX_STOPWATCHES;

  if (e.key === '5') toggleWatch(selected);
  if (e.key === '#') addLap(selected);
  if (e.key === '*') resetWatch(selected);
  if (e.key === '8') showLapHistory = !showLapHistory;

  if (e.key === '3') graphScroll = Math.max(0, graphScroll - 1);
  if (e.key === '9') graphScroll++;

  draw();
  updateUI();
});

function toggleWatch(i) { /* same as before */ 
  const w = watches[i];
  if (!w.running) {
    w.running = true;
    w.startTime = Date.now();
    addMessage(`#${i+1} STARTED`);
  } else {
    w.running = false;
    w.accumulated += Date.now() - w.startTime;
    addMessage(`#${i+1} PAUSED`);
  }
  saveData();
}

function addLap(i) {
  const w = watches[i];
  if (!w.running) return;
  const current = w.accumulated + (Date.now() - w.startTime);
  const lapTime = formatTime(current);
  w.laps.push(current);           // Store raw milliseconds
  addMessage(`Lap ${w.laps.length}`);
  saveData();
}

function resetWatch(i) {
  const w = watches[i];
  w.running = false;
  w.accumulated = 0;
  w.laps = [];
  showLapHistory = false;
  addMessage(`#${i+1} RESET`);
  saveData();
}

function addMessage(msg) {
  messages.unshift(msg);
  if (messages.length > 3) messages.pop();
}

function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const min = Math.floor(total / 60);
  const sec = total % 60;
  const cs = Math.floor((ms % 1000) / 10);
  return `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}.${cs.toString().padStart(2,'0')}`;
}

function saveData() {
  const toSave = watches.map(w => ({
    accumulated: w.accumulated + (w.running ? Date.now() - w.startTime : 0),
    laps: w.laps
  }));
  localStorage.setItem("multiStopwatch", JSON.stringify(toSave));
}

// =============== DRAW WITH LAP DELTA GRAPH ===============
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (showLapHistory && watches[selected].laps.length > 0) {
    drawLapHistoryGraph();
  } else {
    drawNormalView();
  }

  ctx.fillStyle = '#9ee';
  ctx.font = font(9);
  ctx.fillText("5:Start/Pause  #:Lap  *:Reset  8:Graph", sx(10), canvas.height - sy(38));
  ctx.fillText("4/6:Switch   3↑ 9↓:Scroll", sx(10), canvas.height - sy(22));
}

function drawNormalView() {
  const itemHeight = sy(26);
  const startY = sy(45);

  ctx.font = font(14);

  for (let i = 0; i < MAX_STOPWATCHES; i++) {
    const w = watches[i];
    const y = startY + i * itemHeight;
    const isSelected = i === selected;
    const time = w.running ? w.accumulated + (Date.now() - w.startTime) : w.accumulated;

    if (isSelected) {
      ctx.fillStyle = '#003300';
      ctx.fillRect(sx(8), y - sy(8), canvas.width - sx(16), itemHeight);
    }

    ctx.fillStyle = isSelected ? '#0ff' : '#0f0';
    ctx.fillText(`${i+1}. ${formatTime(time)}`, sx(18), y + sy(4));

    ctx.font = font(11);
    ctx.fillStyle = w.running ? '#0f0' : '#666';
    ctx.fillText(w.running ? "● RUN" : "■ STOP", sx(172), y + sy(4));

    if (w.laps.length > 0) {
      ctx.fillStyle = '#ff0';
      ctx.fillText(`L${w.laps.length}`, sx(215), y + sy(4));
    }
    ctx.font = font(14);
  }
}

function drawLapHistoryGraph() {
  const w = watches[selected];
  ctx.font = font(13);
  ctx.fillStyle = '#0f0';
  ctx.fillText(`#${selected+1} - LAP DELTA`, sx(12), sy(32));

  const deltas = [];
  let prev = 0;
  w.laps.forEach(t => {
    deltas.push(t - prev);
    prev = t;
  });

  const startIdx = graphScroll;
  const lineHeight = sy(21);

  for (let i = 0; i < 7; i++) {
    const idx = startIdx + i;
    if (idx >= deltas.length) break;
    ctx.fillStyle = '#0ff';
    ctx.fillText(`${(idx+1).toString().padStart(2,'0')}. ${formatTime(deltas[idx])}`, sx(18), sy(58) + i * lineHeight);
  }

  // Graph
  if (deltas.length > 1) {
    ctx.fillStyle = '#0f0';
    ctx.fillText("LAP TIME GRAPH", sx(15), sy(205));

    const graphY = sy(220);
    const maxDelta = Math.max(...deltas);
    const scale = sy(72) / (maxDelta || 1);
    const barW = sx(19);

    for (let i = 0; i < 8; i++) {
      const idx = startIdx + i;
      if (idx >= deltas.length) break;
      const h = Math.floor(deltas[idx] * scale);
      const x = sx(22 + i * 26);

      ctx.fillStyle = '#0f0';
      ctx.fillRect(x, graphY + sy(68) - h, barW, h);

      ctx.fillStyle = '#aaa';
      ctx.font = font(9);
      ctx.fillText((idx+1).toString(), x + sx(5), graphY + sy(85));
    }
  }
}

function updateUI() {
  document.getElementById('selected').textContent = selected + 1;
  document.getElementById('log').innerHTML = messages.join('<br>');
}

function loop() {
  draw();
  updateUI();
  requestAnimationFrame(loop);
}

addMessage("Ready | 5=Start/Pause | #=Lap | *=Reset | 8=Graph | 3/9=Scroll");
draw();
loop();
</script>
</body>
</html>
