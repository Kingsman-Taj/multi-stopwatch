<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Multi Stopwatch</title>
<style>
html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: monospace;
}
canvas {
    display: block;
    image-rendering: pixelated;
}
#ui {
    position: absolute;
    top: 2vh;
    left: 0; right: 0;
    text-align: center;
    color: #0ff;
    font-size: 5vw;
    font-weight: bold;
    z-index: 10;
}
#log {
    position: absolute;
    bottom: 1.5vh;
    left: 2vw; right: 2vw;
    color: #ff0;
    font-size: 3.2vw;
    z-index: 10;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <strong>MULTI STOPWATCH</strong> | #<span id="selected">1</span>
</div>
<div id="log"></div>

<script>
// =============== BIG FONT + SCROLLABLE LIST ===============
const MAX_STOPWATCHES = 10;
let watches = Array(MAX_STOPWATCHES).fill().map(() => ({
  running: false,
  startTime: 0,
  accumulated: 0,
  laps: []
}));

let selected = 0;
let messages = [];
let showLapHistory = false;
let listScroll = 0;        // Scroll for main list
let graphScroll = 0;


const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function sx(v) { return v * canvas.width / 240; }
function sy(v) { return v * canvas.height / 320; }
function font(size) { return `${Math.floor(sy(size))}px monospace`; }

// Load saved data
const saved = localStorage.getItem("multiStopwatch");
if (saved) {
  try {
    const data = JSON.parse(saved);
    watches = data.map(w => ({
      running: false,
      startTime: 0,
      accumulated: w.accumulated || 0,
      laps: w.laps || []
    }));
  } catch(e) {}
}

document.addEventListener('keydown', e => {
  e.preventDefault();

  if (e.key === '4' || e.key === 'ArrowLeft') selected = (selected - 1 + MAX_STOPWATCHES) % MAX_STOPWATCHES;
  if (e.key === '6' || e.key === 'ArrowRight') selected = (selected + 1) % MAX_STOPWATCHES;

  if (e.key === '5' || e.key === 'Enter') toggleWatch(selected);
  if (e.key === '#') addLap(selected);
  if (e.key === '*') resetWatch(selected);
  if (e.key === '8') showLapHistory = !showLapHistory;

  // Scroll controls
  if (e.key === '3') listScroll = Math.max(0, listScroll - 1);
  if (e.key === '9') listScroll = Math.min(MAX_STOPWATCHES - 5, listScroll + 1);

  draw();
  updateUI();
});

function toggleWatch(i) { /* same */ 
  const w = watches[i];
  if (!w.running) {
    w.running = true;
    w.startTime = Date.now();
    addMessage(`#${i+1} STARTED`);
  } else {
    w.running = false;
    w.accumulated += Date.now() - w.startTime;
    addMessage(`#${i+1} PAUSED`);
  }
  saveData();
}

function addLap(i) {
  const w = watches[i];
  if (!w.running) return;
  const current = w.accumulated + (Date.now() - w.startTime);
  w.laps.push(current);
  addMessage(`Lap ${w.laps.length}`);
  saveData();
}

function resetWatch(i) {
  const w = watches[i];
  w.running = false;
  w.accumulated = 0;
  w.laps = [];
  showLapHistory = false;
  addMessage(`#${i+1} RESET`);
  saveData();
}

function addMessage(msg) {
  messages.unshift(msg);
  if (messages.length > 3) messages.pop();
}

function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const min = Math.floor(total / 60);
  const sec = total % 60;
  const cs = Math.floor((ms % 1000) / 10);
  return `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}.${cs.toString().padStart(2,'0')}`;
}

function saveData() {
  const toSave = watches.map(w => ({
    accumulated: w.accumulated + (w.running ? Date.now() - w.startTime : 0),
    laps: w.laps
  }));
  localStorage.setItem("multiStopwatch", JSON.stringify(toSave));
}

// =============== DRAW ===============
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (showLapHistory && watches[selected].laps.length > 0) {
    drawLapHistoryGraph();
  } else {
    drawScrollableList();
  }

  // Bottom Instructions + Log Area (Reserved Space)
  ctx.fillStyle = '#9ee';
  ctx.font = font(9);
  ctx.fillText("5:Start/Pause  #:Lap  *:Reset  8:Graph", sx(12), canvas.height - sy(38));
  ctx.fillText("4/6:Switch   3↑ 9↓:Scroll List", sx(12), canvas.height - sy(22));
}

function drawScrollableList() {
  ctx.font = font(16);   // Big font as requested
  const itemHeight = sy(38);
  const visibleItems = 6;
  const startIdx = listScroll;

  for (let i = 0; i < visibleItems; i++) {
    const idx = startIdx + i;
    if (idx >= MAX_STOPWATCHES) break;

    const w = watches[idx];
    const y = sy(55) + i * itemHeight;
    const isSelected = idx === selected;
    const time = w.running ? w.accumulated + (Date.now() - w.startTime) : w.accumulated;

    if (isSelected) {
      ctx.fillStyle = '#003300';
      ctx.fillRect(sx(6), y - sy(6), canvas.width - sx(12), itemHeight);
    }

    ctx.fillStyle = isSelected ? '#0ff' : '#0f0';
    ctx.fillText(`${idx+1}. ${formatTime(time)}`, sx(18), y + sy(8));

    ctx.font = font(12);
    ctx.fillStyle = w.running ? '#0f0' : '#666';
    ctx.fillText(w.running ? "● RUNNING" : "■ STOPPED", sx(165), y + sy(8));

    if (w.laps.length > 0) {
      ctx.fillStyle = '#ff0';
      ctx.fillText(`L${w.laps.length}`, sx(220), y + sy(8));
    }
    ctx.font = font(16);
  }
}

function drawLapHistoryGraph() {
  // (Same as previous version - kept for brevity)
  const w = watches[selected];
  ctx.font = font(14);
  ctx.fillStyle = '#0f0';
  ctx.fillText(`#${selected+1} LAP DELTA`, sx(15), sy(35));

  const deltas = [];
  let prev = 0;
  w.laps.forEach(t => { deltas.push(t - prev); prev = t; });

  for (let i = 0; i < 7; i++) {
    const idx = graphScroll + i;
    if (idx >= deltas.length) break;
    ctx.fillStyle = '#0ff';
    ctx.fillText(`${(idx+1).toString().padStart(2,'0')}. ${formatTime(deltas[idx])}`, sx(20), sy(65) + i * sy(22));
  }
}

function updateUI() {
  document.getElementById('selected').textContent = selected + 1;
  document.getElementById('log').innerHTML = messages.join('<br>');
}

function loop() {
  draw();
  updateUI();
  requestAnimationFrame(loop);
}

addMessage("Ready | 5=Start/Pause | #=Lap | *=Reset | 8=Graph ");
draw();
loop();
</script>
</body>
</html>
